spring:
  application:
    name: JWT_ASSYMETRIC
  config:
    import: optional:file:.env[.properties]
  docker:
    compose:
      enabled: true
      profiles:
        active: pg_local
      stop:
        command: down
  #settings of postgres
  datasource:
    url: jdbc:postgresql://${DB_URL}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driverClassName: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: true
    defer-datasource-initialization: true
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    properties:
      hibernate:
        "[format_sql]": true
  sql:
    init:
      mode: always
  data:
    redis:
      host: ${REDIS_URL}
      port: ${REDIS_PORT}

security:
  jwt:
    access_token_expiration: 600000 #
    refresh_token_expiration: 3600000 #
  disposable-email: test, my
