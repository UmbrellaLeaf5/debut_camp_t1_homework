name: homework_3

on:
  push:
    branches:
      - homework_3

jobs:
  homework_3_build_and_run:
    runs-on: ubuntu-latest

    services:
      zookeeper:
        image: bitnami/zookeeper:3.8
        ports:
          - "8081:8081"
        env:
          ALLOW_ANONYMOUS_LOGIN: "yes"

      kafka:
        image: bitnami/kafka:3.6
        ports:
          - "27072:27072"
        env:
          KAFKA_CFG_ZOOKEEPER_CONNECT: zookeeper:8081
          KAFKA_CFG_LISTENERS: PLAINTEXT://:27072
          KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:27072
          KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
          ALLOW_PLAINTEXT_LISTENER: "yes"

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Build parent POM first
        working-directory: ./homework_3/synthetic-human-core-starter
        run: mvn clean install -DskipTests

      - name: Install core starter to local repo
        working-directory: ./homework_3
        run: |
          mkdir -p ~/.m2/repository/io/github/UmbrellaLeaf5/synthetic-human-core-starter/1.0
          cp synthetic-human-core-starter/target/*.jar ~/.m2/repository/io/github/UmbrellaLeaf5/synthetic-human-core-starter/1.0/
          cp synthetic-human-core-starter/pom.xml ~/.m2/repository/io/github/UmbrellaLeaf5/synthetic-human-core-starter/1.0/

      - name: Build with Maven
        working-directory: ./homework_3/bishop-prototype
        run: mvn clean package -DskipTests

      - name: Start Spring Boot application
        working-directory: ./homework_3
        run: |
          java -jar bishop-prototype/target/*.jar &
          echo $! > app.pid
          sleep 15
        env:
          SPRING_KAFKA_BOOTSTRAP_SERVERS: localhost:27072
          SERVER_PORT: 8080

      - name: Install Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install requests package
        run: pip install requests

      - name: Send request
        working-directory: ./homework_3/python
        run: python request.py

      - name: Stop Spring Boot application
        if: always()
        run: |
          if [ -f app.pid ]; then
            kill $(cat app.pid) || true
          fi
