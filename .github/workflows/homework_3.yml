name: homework_3

on:
  push:
    branches:
      - homework_3

jobs:
  homework_3_build_and_run:
    runs-on: ubuntu-latest

    services:
      zookeeper:
        image: bitnami/zookeeper:3.8
        ports:
          - "2181:2181"
        env:
          ALLOW_ANONYMOUS_LOGIN: "yes"

      kafka:
        image: bitnami/kafka:3.6
        ports:
          - "29092:29092"
        env:
          KAFKA_CFG_ZOOKEEPER_CONNECT: zookeeper:2181
          KAFKA_CFG_LISTENERS: PLAINTEXT://:29092
          KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:29092
          KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
          ALLOW_PLAINTEXT_LISTENER: "yes"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update CA certificates
        run: sudo update-ca-certificates

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: "Build with Maven (install: synthetic-human-core-starter)"
        working-directory: ./homework_3/synthetic-human-core-starter
        run: mvn clean install -DskipTests

      - name: Copy core starter to local repo
        working-directory: ./homework_3
        run: |
          mkdir -p ~/.m2/repository/io/github/UmbrellaLeaf5/synthetic-human-core-starter/1.0
          cp synthetic-human-core-starter/target/*.jar ~/.m2/repository/io/github/UmbrellaLeaf5/synthetic-human-core-starter/1.0/
          cp synthetic-human-core-starter/pom.xml ~/.m2/repository/io/github/UmbrellaLeaf5/synthetic-human-core-starter/1.0/

      - name: "Build with Maven (package: bishop-prototype)"
        working-directory: ./homework_3/bishop-prototype
        run: mvn clean package -DskipTests

      - name: Start Spring Boot application
        working-directory: ./homework_3
        run: |
          java -jar bishop-prototype/target/*.jar &
          echo $! > app.pid
          sleep 15
        env:
          SPRING_KAFKA_BOOTSTRAP_SERVERS: localhost:29092
          SERVER_PORT: 8082

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python requests and loguru
        run: pip install requests loguru

      - name: Send request
        working-directory: ./homework_3
        run: python python/request.py

      - name: Stop Spring Boot application
        if: always()
        run: |
          if [ -f app.pid ]; then
            kill $(cat app.pid) || true
          fi

      - name: Commit logs to output branch
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

          git fetch origin output
          git checkout output
          git pull origin output

          git add ./homework_3/logs/

          git commit -m "add log files from workflow run (date: $(date +'%d.%m.%Y %H:%M:%S'))"

          git push origin output -f
